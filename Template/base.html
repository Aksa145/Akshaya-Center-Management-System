{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Akshaya Center Software</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="sidebar">

    <div>

        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-star"></i>
            </div>

            <h4>AkshayaFlow</h4>
        </div>

        <a href="/dashboard/" class="menu active">
            <i class="fa-solid fa-table-columns"></i>
            Dashboard
        </a>

        <a href="/sales/" class="menu">
            <i class="fa-solid fa-file-invoice"></i>
            Sales Entry
        </a>

        <a href="/products/" class="menu">
            <i class="fa-solid fa-list"></i>
            Services
        </a>

        <!-- <a href="/users/" class="menu">
            <i class="fa-solid fa-users"></i>
            Staff Management
        </a> -->
        {% if request.user.is_superuser %}
<a href="/users/" class="menu">
    <i class="fa-solid fa-users"></i>
    Staff Management
</a>
{% endif %}

        <a href="/reports/" class="menu">
            <i class="fa-solid fa-chart-line"></i>
            Reports
        </a>
        <a href="/logout/" class="btn btn-danger btn-sm">
    Logout
</a>
<div style="margin-top:10px;">
        <a href="/change-password/" class="btn btn-warning">
            Change Password
        </a>
    </div>

    </div>

    <div class="profile">

        <div class="avatar">
            {{ request.user.username|first|upper }}
        </div>

        <div>
            <b>{{ request.user.username }}</b>
            <div class="small">
                Admin
            </div>
        </div>

    </div>

</div>

<div class="content">

{% block content %}
{% endblock %}

</div>

</body>
</html>
