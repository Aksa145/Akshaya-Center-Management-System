{% load static %}

<!DOCTYPE html>
<html>
<head>

<title>Reports</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{% static 'css/sales.css' %}">

</head>

<body>

<div class="container-fluid p-4">

<!-- TOP BAR -->
<div class="topbar">

    <h3>Akshaya Billing - Reports</h3>

    <a href="/dashboard/" class="btn btn-light">
        ← Back
    </a>

</div>

<!-- FILTER SECTION -->
<div class="card p-3 mt-3 shadow">

<form method="GET">

<div class="row">

    <div class="col-md-3">
        <label>From Date</label>
        <input type="date" name="from_date" class="form-control">
    </div>

    <div class="col-md-3">
        <label>To Date</label>
        <input type="date" name="to_date" class="form-control">
    </div>

    <div class="col-md-3">
        <label>Staff</label>
        <select name="staff" class="form-control">
            <option value="All">All</option>
            <option value="akshaya">akshaya</option>
            <option value="josmi">josmi</option>
            <option value="anu">anu</option>
        </select>
    </div>

    <div class="col-md-3 d-flex align-items-end">
        <button class="btn btn-primary w-100">Filter</button>
    </div>

</div>

</form>

</div>

<!-- ACTION BUTTONS -->
<div class="mt-3">

    <a href="/export-excel/" class="btn btn-success">
        ⬇ Export Excel
    </a>

    <a href="/export-csv/" class="btn btn-primary">
        ⬇ Export CSV
    </a>

</div>

<!-- TOTAL -->
<div class="card p-3 mt-3 shadow">

    <h5>Total Collection</h5>
    <h2>₹ {{ total }}</h2>

</div>

<!-- TABLE -->
<div class="card p-3 mt-3 shadow">

<table class="table table-bordered table-hover text-center">

<thead class="table-dark">

<tr>
    <th>ID</th>
    <th>Date</th>
    <th>Staff</th>
    <th>Product</th>
    <th>Amount</th>
</tr>

</thead>

<tbody>

{% for r in reports %}

<tr>
    <td>{{ r.id }}</td>
    <td>{{ r.date }}</td>
    <td>{{ r.staff }}</td>
    <td>{{ r.product }}</td>
    <td>₹ {{ r.amount }}</td>
</tr>

{% empty %}

<tr>
    <td colspan="5">No Data Found</td>
</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>
</html>
